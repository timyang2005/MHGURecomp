name: Build Android APK

# 手动触发，或在推送 v* 标签时自动构建。
# 产物：build-android/mhgurecomp.apk（arm64-v8a，用固定 release keystore 签名）

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本名，例如 0.15.0（留空则取最近的 tag）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ABI: arm64-v8a
  ANDROID_API: "35"
  NDK_VERSION: "27.2.12479018"
  BUILD_TOOLS_VERSION: "35.0.0"
  CMAKE_VERSION: "3.22.1"
  KEYSTORE_PATH: ${{ github.workspace }}/.signing/mhgurecomp-release.keystore

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: 检出源码（需要完整历史与 tag）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK 命令行工具
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件（platform / build-tools / NDK / CMake）
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: 安装主机依赖与 Python 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang curl pkg-config zstd unzip
          python3 -m venv tools/venv
          tools/venv/bin/pip install --upgrade pip
          tools/venv/bin/pip install -r tools/requirements.txt

      - name: 还原固定签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASS:-}" ]; then
            echo "::error::缺少签名密钥：请在 Settings → Secrets and variables → Actions 中添加 ANDROID_KEYSTORE_BASE64 与 ANDROID_KEYSTORE_PASSWORD"
            cat <<'TIP'
          生成一把固定的 release 密钥（只需一次，务必离线备份 keystore 与密码）：

            keytool -genkeypair -keystore mhgurecomp-release.keystore -storetype PKCS12 \
              -alias mhgurecomp -keyalg RSA -keysize 4096 -validity 36500 \
              -dname "CN=MHGURecomp" -storepass '你的密码' -keypass '你的密码'

          把 keystore 转成 base64 填进 ANDROID_KEYSTORE_BASE64：

            base64 -w0 mhgurecomp-release.keystore

          ANDROID_KEYSTORE_PASSWORD 填上面的密码。
          TIP
            exit 1
          fi
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          printf '%s' "$KEYSTORE_PASS" > "$KEYSTORE_PATH.pass"
          chmod 600 "$KEYSTORE_PATH" "$KEYSTORE_PATH.pass"
          # 立即验证密钥可用，避免构建到一半才失败
          keytool -list -keystore "$KEYSTORE_PATH" -storepass:file "$KEYSTORE_PATH.pass" > /dev/null
          # 自动取出私钥别名，显式传给 apksigner（不依赖「单条目时自动选择」的行为）
          KEY_ALIAS="$(keytool -list -keystore "$KEYSTORE_PATH" -storepass:file "$KEYSTORE_PATH.pass" \
            | awk -F, '/PrivateKeyEntry/ {print $1; exit}' | tr -d '[:space:]')"
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::密钥库中没有私钥条目，请检查 ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "签名别名：$KEY_ALIAS"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: 记录签名证书指纹（用来确认每次构建沿用同一签名）
        run: |
          set -euo pipefail
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass:file "$KEYSTORE_PATH.pass" \
            | grep -E 'Alias name|Owner|Valid from|SHA1:|SHA256:' | tee signing-fingerprint.txt

      - name: 可选：取回预生成的游戏代码（release tag 为 gamecode 的 generated.tar.zst）
        id: gamegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p /tmp/gen
          gh release download gamecode --pattern 'generated.tar.zst' --dir /tmp/gen --clobber 2>/dev/null
          if [ -f /tmp/gen/generated.tar.zst ]; then
            tar --zstd -xf /tmp/gen/generated.tar.zst -C .
            if [ -d generated ]; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "已取回 generated/，本次将构建完整 APK（含 libmhgugame.so）"
              exit 0
            fi
          fi
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "未找到 generated/，本次只构建运行时（APK 不含游戏代码）"

      - name: 构建 APK（release 签名）
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif TAG="$(git describe --tags --abbrev=0 2>/dev/null)"; then
            VERSION="${TAG#v}"
          else
            VERSION="0.0.$(git rev-list --count HEAD)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "构建版本：$VERSION"
          # 用 DEBUG_SIGN 变量把 apk 目标的签名换成固定 release key，避免依赖 make dist
          # （dist 会校验 generated/gen.id，没有游戏文件时必然失败）
          make PLATFORM=android ABI="$ABI" -j"$(nproc)" VERSION="$VERSION" \
            DEBUG_SIGN="--ks $KEYSTORE_PATH --ks-key-alias $KEY_ALIAS --ks-pass file:$KEYSTORE_PATH.pass --v4-signing-enabled false"

      - name: 校验 APK 签名与内容
        run: |
          set -euo pipefail
          APK="build-android/mhgurecomp.apk"
          test -f "$APK"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee certs.txt
          sha256sum "$APK" | tee sha256.txt
          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmhgugame\.so'; then
            echo "GAME_LIB=yes" >> "$GITHUB_ENV"
          else
            echo "GAME_LIB=no" >> "$GITHUB_ENV"
          fi
          # 签名必须与 secrets 里的固定密钥一致
          if ! grep -q "Signer #1 certificate SHA-256" certs.txt; then
            echo "::error::APK 签名校验失败"
            exit 1
          fi

      - name: 写入构建摘要
        run: |
          {
            echo "### Android APK 构建结果"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`$VERSION\` |"
            echo "| ABI | \`$ABI\` |"
            echo "| APK 大小 | $(du -h build-android/mhgurecomp.apk | cut -f1) |"
            echo "| SHA-256 | \`$(cut -d' ' -f1 sha256.txt)\` |"
            echo "| 含游戏代码 | $([ "$GAME_LIB" = yes ] && echo '是' || echo '否') |"
            echo ""
            echo "**签名证书**（每次构建应完全一致）"
            echo ""
            echo '```'
            cat signing-fingerprint.txt
            echo '```'
            if [ "$GAME_LIB" = "no" ]; then
              echo ""
              echo "> ⚠️ 此 APK 不含 \`libmhgugame.so\`。仓库本身不含游戏文件，无法重编译游戏代码，"
              echo "> 装到手机上会提示缺少游戏文件。要得到可玩的完整 APK，请先在本机执行"
              echo "> \`make gen GAME=<游戏文件目录>\`，把生成的 \`generated/\` 打包为"
              echo "> \`generated.tar.zst\` 并上传到标签为 \`gamecode\` 的 Release，再重新运行本工作流。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MHGURecomp-${{ env.VERSION }}-arm64-v8a
          path: |
            build-android/mhgurecomp.apk
            certs.txt
            sha256.txt
            signing-fingerprint.txt
          if-no-files-found: error

      - name: 推 tag 时附加到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-android/mhgurecomp.apk
          fail_on_unmatched_files: true
